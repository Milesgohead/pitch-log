name: iOS unsigned IPA

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'src/**'
      - 'vite.config.ts'
      - '.github/workflows/ios-unsigned-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Generate and sync the iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Compile unsigned iOS app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -sdk iphoneos
          -derivedDataPath "$RUNNER_TEMP/pitchlog-derived"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/pitchlog-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/pitchlog-ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/pitchlog-ipa/Payload/App.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/pitchlog-ipa/Payload" "$RUNNER_TEMP/PitchLog-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/PitchLog-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitch-log-unsigned-ipa
          path: ${{ runner.temp }}/PitchLog-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
